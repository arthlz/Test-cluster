model:
  name: "Qwen/Qwen3-VL-4B-Instruct"
  provider: "huggingface"
  max_tokens: 512
  torch_dtype: "bfloat16"
  temperature: 0.2
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.05        # Evita loops de repetição sem distorcer termos anatômicos

prompt:
  file: "prompts/specific_prompt.txt"

dataset:
  name: "roco-v2"
  random_seed: 42

rag:
  num_examples: 3
  similarity_threshold: 0.5

analysis:
  enable_cost_analysis: true
  enable_evaluation: true
  cost_analysis_format: "markdown"  # Options: markdown, json, csv
  evaluation_metrics: ["bleu", "rouge"]

paths:
  vectordb: "pipeline_state/vectordb"
  responses: "responses/qwen/qwen3-vl-4b_rag_3_examples"
  evaluation_results: "evaluation_results/qwen/qwen3-vl-4b-instruct_rag_3_examples"
  cost_analysis: "cost_analysis/qwen"
